<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- =================== NAVBAR =================== -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container">

        <a class="navbar-brand fw-bold" href="#">
            Student Registration System
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-controls="navbarMenu"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">

            <ul class="navbar-nav ms-auto align-items-center">

                <!-- Theme Selector -->

                <li class="nav-item me-3">

                    <label for="themeSelector" class="form-label text-white mb-0 me-2">
                        
                    </label>
                    <!-- <select class="form-select form-select-sm d-inline-block w-auto" id="themeSelector">
                        <option value="default">Sunset</option>
                        <option value="primary">Blue</option>
                        <option value="success">Green</option>
                        <option value="danger">Red</option>
                        <option value="dark">Dark</option>
                    </select> -->

                </li>

                <!-- Dark Mode -->

                <li class="nav-item me-3">

                    <div class="form-check form-switch">

                        <input class="form-check-input"
                               type="checkbox"
                               id="darkMode">

                        <label class="form-check-label text-white" for="darkMode">
                            Dark Mode
                        </label>

                    </div>

                </li>

            </ul>

        </div>

    </div>
</nav>

<!-- =================== MAIN CONTAINER =================== -->

<div class="container my-5">

    <!-- =================== REGISTRATION CARD =================== -->

    <div class="card shadow-lg">

        <div class="card-header bg-primary text-white">

            <h2 class="text-center">
                Student Registration Form
            </h2>

        </div>

        <div class="card-body">

            <form id="registrationForm" novalidate>

                <!-- Personal Information -->

                <h4 class="mb-3">
                    Personal Information
                </h4>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label" for="name">
                            Full Name
                        </label>

                        <input
                        type="text"
                        class="form-control"
                        id="name"
                        autocomplete="name">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label" for="email">
                            Email
                        </label>

                        <input
                        type="email"
                        class="form-control"
                        id="email"
                        autocomplete="email">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label" for="username">
                            Username
                        </label>

                        <input
                        type="text"
                        class="form-control"
                        id="username"
                        autocomplete="username">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label" for="phone">
                            Phone Number
                        </label>

                        <input
                        type="tel"
                        class="form-control"
                        id="phone"
                        autocomplete="tel">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label" for="dob">
                            Date of Birth
                        </label>

                        <input
                        type="date"
                        class="form-control"
                        id="dob">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label" for="gender">
                            Gender
                        </label>

                        <select
                        class="form-select"
                        id="gender">

                            <option value="">
                                Select Gender
                            </option>

                            <option>
                                Male
                            </option>

                            <option>
                                Female
                            </option>

                            <option>
                                Other
                            </option>

                        </select>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label" for="password">
                            Password
                        </label>

                        <input
                        type="password"
                        class="form-control"
                        id="password"
                        autocomplete="new-password">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label" for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                        type="password"
                        class="form-control"
                        id="confirmPassword"
                        autocomplete="new-password">

                    </div>

                </div>

                <!-- Show Password -->

                <div class="form-check mb-3">

                    <input
                    class="form-check-input"
                    type="checkbox"
                    id="showPassword">

                    <label class="form-check-label" for="showPassword">
                        Show Password
                    </label>

                </div>

                <!-- Password Strength -->

                <label class="form-label">
                    Password Strength
                </label>

                <div class="progress mb-4">

                    <div
                    class="progress-bar"
                    id="strengthBar"
                    role="progressbar"
                    style="width:0%">
                    </div>

                </div>

                <!-- Profile Picture -->

                <h4 class="mb-3">
                    Profile Picture
                </h4>

                <input
                type="file"
                class="form-control mb-3"
                id="profilePicture"
                accept="image/*">

                <div class="text-center">

                    <img
                    id="previewImage"
                    src="rapunzel.jfif"
                    alt="Profile preview"
                    class="img-thumbnail"
                    width="150"
                    style="display:none;">

                </div>

                <hr>

                <!-- Terms -->

                <div class="form-check mb-4">

                    <input
                    class="form-check-input"
                    type="checkbox"
                    id="terms">

                    <label class="form-check-label" for="terms">

                        I agree to the Terms &
                        Conditions

                    </label>

                </div>

                <!-- Buttons -->

                <div class="text-center">

                    <button
                    type="submit"
                    class="btn btn-primary me-2">

                        Register

                    </button>

                    <button
                    type="reset"
                    class="btn btn-secondary">

                        Reset

                    </button>

                </div>

                <br>

                <!-- Error -->

                <div id="error"
                     class="text-danger text-center fw-bold"
                     role="alert">
                </div>

            </form>

        </div>

    </div>

    <!-- Success Alert -->

    <div
    class="alert alert-success mt-4 text-center d-none"
    id="successMessage"
    role="status">

        Registration Successful!

    </div>

    <!-- ================= SEARCH ================= -->

    <div class="card shadow mt-5">

        <div class="card-body">

            <h4>
                Search Student
            </h4>

            <input
            type="text"
            class="form-control"
            id="searchStudent"
            placeholder="Search by Name or Username">

        </div>

    </div>

    <!-- ================= BUTTONS ================= -->

    <div class="text-center my-4">

        <button
        class="btn btn-info me-2"
        id="sortBtn">

            Sort by Name

        </button>

        <button
        class="btn btn-success me-2"
        id="exportCSV">

            Export CSV

        </button>

        <button
        class="btn btn-danger"
        id="clearAll">

            Clear All Students

        </button>

    </div>

    <!-- ================= TABLE ================= -->

    <div class="card shadow">

        <div class="card-header bg-dark text-white">

            Registered Students

        </div>

        <div class="card-body table-responsive">

            <table
            class="table table-bordered table-hover align-middle text-center"
            id="studentTable">

                <thead class="table-primary">

                    <tr>

                        <th>#</th>

                        <th>Profile</th>

                        <th>Full Name</th>

                        <th>Username</th>

                        <th>Email</th>

                        <th>Phone</th>

                        <th>Age</th>

                        <th>Gender</th>

                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody>

                    <tr id="noStudentsRow">
                        <td colspan="9" class="text-muted py-4">
                            No students registered yet.
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="script1.js"></script>

</body>
</html>
